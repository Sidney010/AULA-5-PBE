openapi: 3.0.3
info:
  title: API Locadora de Filmes - SENAI Jandira 
  description: |-
    API destinada ao controle de dados de um sistema de Locadora de Filmes.
  termsOfService: http://swagger.io/terms/
  contact:
    email: sidneyc.aragao@email.com
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  version: 1.0.0
externalDocs:
  description: Find out more about Swagger
  url: http://swagger.io
servers:
  - url: http://localhost:8080/
paths:
  /v1/locadora/nacionalidade:
    post:
      tags:
        - Nacionalidade
      summary: Adiciona uma nova Nacionalidade
      description: Adiciona uma nova nacionalidade para atores.
      requestBody:
        $ref: '#/components/requestBodies/Nacionalidade'
      responses:
        '201':
          description: Nacionalidade adicionada com sucesso
        '400':
          description: Entrada invalida
    get:
      tags:
        - Nacionalidade
      summary: Lista todas as Nacionalidades
      description: Retorna uma lista de todas as nacionalidades registradas.
      responses:
        '200':
          description: Operacao bem-sucedida
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Nacionalidade'    
        '404':
          description: Nao Encontrado
  /v1/locadora/nacionalidade/{id_nacionalidade}:
    get:
      tags:
        - Nacionalidade
      summary: Busca uma Nacionalidade pelo ID
      description: Retorna uma nacionalidade pelo seu ID.
      parameters:
        - name: id_nacionalidade
          in: path
          description: ID da nacionalidade a ser retornada
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Operacao bem-sucedida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Nacionalidade'    
        '400':
          description: ID fornecido invalido
        '404':
          description: Nacionalidade nao encontrada
    put:
      tags:
        - Nacionalidade
      summary: Atualiza uma Nacionalidade existente
      description: Atualiza uma nacionalidade existente pelo seu ID.
      parameters:
        - name: id_nacionalidade
          in: path
          description: ID da nacionalidade a ser atualizada
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        $ref: '#/components/requestBodies/Nacionalidade'
      responses:
        '200':
          description: Operacao bem-sucedida
        '400':
          description: ID fornecido invalido ou entrada invalida
        '404':
          description: Nacionalidade nao encontrada
    delete:
      tags:
        - Nacionalidade
      summary: Exclui uma Nacionalidade
      description: Exclui uma nacionalidade pelo seu ID.
      parameters:
        - name: id_nacionalidade
          in: path
          description: ID da nacionalidade a ser excluida
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Operacao bem-sucedida
        '400':
          description: ID fornecido invalido
        '404':
          description: Nacionalidade nao encontrada
  
