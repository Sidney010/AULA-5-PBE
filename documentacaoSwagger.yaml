components:
  schemas:
    Nacionalidade:
      required:
        - nome
      type: object
      properties:
        id_nacionalidade:
          type: integer
          description: ID da Nacionalidade
        nome:
          type: string
          description: Nome da nacionalidade
    Genero:
      required:
        - nome
      type: object
      properties:
        id_genero:
          type: integer
          description: ID do Genero
        nome:
          type: string
          description: Nome do genero
    ClassificacaoEtaria:
      required:
        - sigla
        - descricao
        - icone
      type: object
      properties:
        id_classificacao_etaria:
          type: integer
          description: ID da Classificacao Etaria
        sigla:
          type: string
          description: Sigla da classificacao
        descricao:
          type: string
          description: Descricao da classificacao
        icone:
          type: string
          description: URL do icone representativo
    Estudio:
      required:
        - nome
      type: object
      properties:
        id_estudio:
          type: integer
          description: ID do Estudio
        nome:
          type: string
          description: Nome do estudio
        site:
          type: string
          description: Site oficial do estudio
    Ator:
      required:
        - nome
        - data_nascimento
        - id_nacionalidade
      type: object
      properties:
        id_ator:
          type: integer
          description: ID do Ator
        nome:
          type: string
          description: Nome do ator/atriz
        nome_artistico:
          type: string
          description: Nome artistico do ator/atriz
        data_nascimento:
          type: string
          format: date
          description: Data de nascimento
        data_falecimento:
          type: string
          format: date
          description: Data de falecimento (opcional)
        foto:
          type: string
          description: URL da foto do ator
        biografia:
          type: string
          description: Biografia do ator
        id_nacionalidade:
          type: integer
          description: ID da Nacionalidade
    Filme:
      required:
        - nome
        - data_lancamento
        - duracao
        - id_classificacao_etaria
        - id_estudio
      type: object
      properties:
        id_filme:
          type: integer
          description: ID do Filme
        nome:
          type: string
          description: Titulo do filme
        sinopse:
          type: string
          description: Sinopse do filme
        data_lancamento:
          type: string
          format: date
          description: Data de lancamento
        data_relancamento:
          type: string
          format: date
          description: Data de relancamento (opcional)
        duracao:
          type: string
          description: Duracao do filme (formato HH:MM:SS)
        foto_capa:
          type: string
          description: URL da foto de capa
        valor_unitario:
          type: number
          format: float
          description: Valor unitario do aluguel
        id_classificacao_etaria:
          type: integer
          description: ID da Classificacao Etaria
        id_estudio:
          type: integer
          description: ID do Estudio
    FilmeAtor:
      required:
        - filme_id
        - ator_id
      type: object
      properties:
        id_filme_ator:
          type: integer
          description: ID do relacionamento Filme-Ator
        filme_id:
          type: integer
          description: ID do Filme
        ator_id:
          type: integer
          description: ID do Ator
    FilmeGenero:
      required:
        - filme_id
        - genero_id
      type: object
      properties:
        id_filme_genero:
          type: integer
          description: ID do relacionamento Filme-Genero
        filme_id:
          type: integer
          description: ID do Filme
        genero_id:
          type: integer
          description: ID do Genero

  requestBodies:
    Nacionalidade:
      description: Objeto Nacionalidade para ser adicionado ou atualizado
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Nacionalidade'
    Genero:
      description: Objeto Genero para ser adicionado ou atualizado
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Genero'
    ClassificacaoEtaria:
      description: Objeto Classificacao Etaria para ser adicionado ou atualizado
      required: true
      content:
        application/json:
          schema:
